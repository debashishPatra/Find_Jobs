# ===== Server =====
server.port=${PORT:8080}

# ===== MySQL =====
# Locally these fall back to your local MySQL. In production (Render), set
# DB_URL, DB_USERNAME, DB_PASSWORD as environment variables pointing at your
# Clever Cloud (or other) MySQL instance.
spring.datasource.url=${DB_URL:mysql://avnadmin:AVNS_I4ye6OpqRlvTKUrVbZn@mysql-344a85a8-patradebashishdp-9cd7.l.aivencloud.com:17044/defaultdb?ssl-mode=REQUIRED}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD:AVNS_I4ye6OpqRlvTKUrVbZn}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.defer-datasource-initialization=true

# Run data.sql after Hibernate creates tables (seed categories)
spring.sql.init.mode=always

# ===== JWT =====
# IMPORTANT: in production, set the JWT_SECRET environment variable to your
# own long random string (32+ characters). Never deploy with the default.
jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-key-at-least-32-bytes-long}
jwt.expiration-ms=86400000

# ===== CORS =====
# Comma-separated list of allowed frontend origins. Locally this allows any
# localhost port; in production set FRONTEND_URL to your Netlify URL, e.g.
# https://your-app.netlify.app
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000}
